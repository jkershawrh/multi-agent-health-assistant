---
# By default, the OpenShift chart builds one image from this public source
# repository and reuses it for the orchestrator and all three agent roles.
build:
  enabled: true
  gitUri: https://github.com/jkershawrh/multi-agent-health-assistant.git
  gitRef: main
  contextDir: src

# To use an existing image instead, set build.enabled=false and provide a
# repository. The same image contains both agent.py and orchestrator.py.
image:
  repository: ""
  tag: latest
  pullPolicy: Always

# OpenAI-compatible model configuration. Leave endpoint empty for the clearly
# labeled simulator. Authentication is read from an existing Kubernetes Secret.
model:
  name: qwen2.5:1.5b
  endpoint: ""
  existingSecret: ""
  apiKeySecretKey: api-key

limits:
  maxStoredTasks: 1000
  maxContextChars: 8000

orchestrator:
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: "500m"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "512Mi"

agents:
  triage:
    replicas: 1
    port: 8001
    env:
      AGENT_NAME: triage
      AGENT_SKILLS: classify,prioritize
    resources:
      requests:
        cpu: "500m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"

  clinical:
    replicas: 1
    port: 8002
    env:
      AGENT_NAME: clinical
      AGENT_SKILLS: diagnose,recommend
    resources:
      requests:
        cpu: "500m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"

  scheduling:
    replicas: 1
    port: 8003
    env:
      AGENT_NAME: scheduling
      AGENT_SKILLS: schedule,notify
    resources:
      requests:
        cpu: "500m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
