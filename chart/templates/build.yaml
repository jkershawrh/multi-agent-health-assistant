{{- if .Values.build.enabled }}
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  source:
    type: Git
    git:
      uri: {{ .Values.build.gitUri | quote }}
      ref: {{ .Values.build.gitRef | quote }}
    contextDir: {{ .Values.build.contextDir | quote }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: {{ printf "%s:%s" .Release.Name .Values.image.tag | quote }}
  triggers:
    - type: ConfigChange
{{- end }}
