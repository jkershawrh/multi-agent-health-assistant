{{- $image := printf "image-registry.openshift-image-registry.svc:5000/%s/%s:%s" .Release.Namespace .Release.Name .Values.image.tag -}}
{{- if .Values.image.repository -}}
{{- $image = printf "%s:%s" .Values.image.repository .Values.image.tag -}}
{{- end }}
{{- range $name, $agent := .Values.agents }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $.Release.Name }}-{{ $name }}
    app.kubernetes.io/component: agent
    agent-type: {{ $name }}
spec:
  replicas: {{ $agent.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Release.Name }}-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Release.Name }}-{{ $name }}
        app.kubernetes.io/component: agent
        agent-type: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}-agent
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $agent.port }}
          command: ["uvicorn", "agent:app", "--host", "0.0.0.0", "--port", "{{ $agent.port }}"]
          env:
            - name: AGENT_NAME
              value: {{ $agent.env.AGENT_NAME | quote }}
            - name: AGENT_SKILLS
              value: {{ $agent.env.AGENT_SKILLS | quote }}
            - name: AGENT_PORT
              value: {{ $agent.port | quote }}
            - name: AGENT_PUBLIC_URL
              value: "http://{{ $.Release.Name }}-{{ $name }}:{{ $agent.port }}/a2a"
            {{- if $.Values.model.endpoint }}
            - name: MODEL_ENDPOINT
              value: {{ $.Values.model.endpoint | quote }}
            {{- end }}
            - name: MODEL_NAME
              value: {{ $.Values.model.name | quote }}
            {{- if $.Values.model.existingSecret }}
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.model.existingSecret | quote }}
                  key: {{ $.Values.model.apiKeySecretKey | quote }}
            {{- end }}
            - name: DEMO_MODE
              value: {{ if $.Values.model.endpoint }}"false"{{ else }}"true"{{ end }}
            - name: MAX_STORED_TASKS
              value: {{ $.Values.limits.maxStoredTasks | quote }}
          resources:
            {{- toYaml $agent.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $agent.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ $agent.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $.Release.Name }}-{{ $name }}
  ports:
    - port: {{ $agent.port }}
      targetPort: {{ $agent.port }}
{{- end }}
