{{- $image := printf "image-registry.openshift-image-registry.svc:5000/%s/%s:%s" .Release.Namespace .Release.Name .Values.image.tag -}}
{{- if .Values.image.repository -}}
{{- $image = printf "%s:%s" .Values.image.repository .Values.image.tag -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-orchestrator
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-orchestrator
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-orchestrator
        app.kubernetes.io/component: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.orchestrator.port }}
          command: ["uvicorn", "orchestrator:app", "--host", "0.0.0.0", "--port", "{{ .Values.orchestrator.port }}"]
          env:
            - name: AGENT_URLS
              value: "http://{{ .Release.Name }}-triage:{{ .Values.agents.triage.port }},http://{{ .Release.Name }}-clinical:{{ .Values.agents.clinical.port }},http://{{ .Release.Name }}-scheduling:{{ .Values.agents.scheduling.port }}"
            - name: MAX_CONTEXT_CHARS
              value: {{ .Values.limits.maxContextChars | quote }}
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.orchestrator.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.orchestrator.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-orchestrator
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-orchestrator
  ports:
    - port: {{ .Values.orchestrator.port }}
      targetPort: {{ .Values.orchestrator.port }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}
spec:
  to:
    kind: Service
    name: {{ .Release.Name }}-orchestrator
  port:
    targetPort: {{ .Values.orchestrator.port }}
  tls:
    termination: edge
