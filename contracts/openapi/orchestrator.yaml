openapi: "3.1.0"
info:
  title: Multi-Agent Health Workflow Demo Orchestrator API
  description: >
    Routes synthetic scenarios through three teaching agents using a small
    A2A 0.3-style JSON-RPC subset. This is not an A2A conformance
    implementation or a medical system.
  version: "1.0.0"
  contact:
    name: Red Hat AI Quickstarts
    url: https://github.com/rh-ai-quickstart

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns service health status and discovered agent count.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Confirms that every configured teaching agent was discovered.
      responses:
        "200":
          description: Orchestrator is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: One or more configured agents have not been discovered

  /api/v1/agents:
    get:
      operationId: listAgents
      summary: List discovered agents
      description: Returns agents discovered from their example agent cards.
      responses:
        "200":
          description: List of discovered agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"

  /api/v1/workflow:
    post:
      operationId: runWorkflow
      summary: Run a multi-agent workflow
      description: >
        Routes synthetic text through discovered agents sequentially. Supports
        patient_triage and general teaching workflows. Each step records the
        role, action, result, and measured latency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRequest"
      responses:
        "200":
          description: Workflow completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, agents_discovered, agent_names]
      properties:
        status:
          type: string
          example: "healthy"
        agents_discovered:
          type: integer
          example: 3
        agent_names:
          type: array
          items:
            type: string
          example: ["triage", "clinical", "scheduling"]

    ReadyResponse:
      type: object
      required: [status, agents_discovered, agent_names]
      properties:
        status:
          type: string
          enum: [ready]
        agents_discovered:
          type: integer
          example: 3
        agent_names:
          type: array
          items:
            type: string
          example: ["triage", "clinical", "scheduling"]

    AgentCapabilities:
      type: object
      properties:
        streaming:
          type: boolean
          default: false
        pushNotifications:
          type: boolean
          default: false
        stateTransitionHistory:
          type: boolean
          default: true

    AgentSkill:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
          example: "orchestrate-workflow"
        name:
          type: string
          example: "Orchestrate Workflow"
        description:
          type: string
          example: "Execute a synthetic multi-agent teaching workflow"
        tags:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string

    AgentCard:
      type: object
      required: [name, description, version, url, protocolVersion, preferredTransport, skills]
      properties:
        name:
          type: string
          example: "orchestrator"
        description:
          type: string
        version:
          type: string
          example: "0.1.0"
        url:
          type: string
          format: uri
          example: "http://localhost:8001/a2a"
        protocolVersion:
          type: string
          example: "0.3.0"
        preferredTransport:
          type: string
          enum: [JSONRPC]
        provider:
          type: string
          example: "Red Hat / Intel"
        capabilities:
          $ref: "#/components/schemas/AgentCapabilities"
        defaultInputModes:
          type: array
          items:
            type: string
        defaultOutputModes:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/AgentSkill"

    DiscoveredAgent:
      type: object
      required: [name, url, status]
      properties:
        name:
          type: string
          example: "triage"
        url:
          type: string
          format: uri
          example: "http://triage-agent:8001"
        status:
          type: string
          example: "active"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/AgentSkill"

    AgentListResponse:
      type: object
      required: [agents, count]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveredAgent"
        count:
          type: integer
          example: 3

    WorkflowRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          example: "Synthetic intake event for routing demonstration"
        workflow_type:
          type: string
          enum: [patient_triage, general]
          default: "general"
          example: "patient_triage"

    WorkflowStep:
      type: object
      required: [agent, action, result, latency_ms]
      properties:
        agent:
          type: string
          example: "triage"
        action:
          type: string
          example: "classify"
        result:
          type: string
          example: "[DEMO SIMULATION] Triage-routing handoff complete"
        latency_ms:
          type: number
          format: float
          example: 45.2

    WorkflowResponse:
      type: object
      required: [steps, total_latency_ms, agents_involved, ai_disclaimer]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        total_latency_ms:
          type: number
          format: float
          example: 312.5
        agents_involved:
          type: array
          items:
            type: string
          example: ["triage", "clinical", "scheduling"]
        status:
          type: string
          enum: [completed, failed]
          default: completed
        failed_step:
          type: [string, "null"]
        ai_disclaimer:
          type: string
          example: "Educational simulation only. It does not provide medical advice, diagnosis, treatment, triage, scheduling, or emergency services. Use synthetic data only."

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
