openapi: "3.1.0"
info:
  title: A2A-Style Health Workflow Teaching Agent API
  description: >
    Educational API implementing a small A2A 0.3-style discovery and JSON-RPC
    subset for synthetic workflow scenarios. It is not a protocol-conformance
    implementation or a medical system.
  version: "1.0.0"
  contact:
    name: Red Hat AI Quickstarts
    url: https://github.com/rh-ai-quickstart

servers:
  - url: http://localhost:8001
    description: Triage agent
  - url: http://localhost:8002
    description: Clinical agent
  - url: http://localhost:8003
    description: Scheduling agent

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns agent health status and identity.
      responses:
        "200":
          description: Agent is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Confirms demo mode or the configured model endpoint is reachable.
      responses:
        "200":
          description: Agent is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Configured model endpoint is unavailable

  /.well-known/agent-card.json:
    get:
      operationId: getAgentCard
      summary: A2A agent discovery
      description: >
        Returns the agent's A2A card with name, description, skills, and
        protocol version for discovery by orchestrators or other agents.
      responses:
        "200":
          description: Agent card returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCard"

  /a2a:
    post:
      operationId: a2aEndpoint
      summary: A2A JSON-RPC 2.0 endpoint
      description: >
        Handles the teaching subset's JSON-RPC 2.0 requests. Supports
        message/send to create and execute an in-memory task and tasks/get
        to retrieve a task created by this process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: JSON-RPC response with task result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "422":
          description: Request validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, agent, mode, model]
      properties:
        status:
          type: string
          example: "healthy"
        agent:
          type: string
          example: "triage"
        mode:
          type: string
          enum: [demo, llm]
          example: "demo"
        model:
          type: string
          example: "demo-simulator"

    ReadyResponse:
      type: object
      required: [status, agent, mode, model]
      properties:
        status:
          type: string
          enum: [ready]
        agent:
          type: string
          example: "triage"
        mode:
          type: string
          enum: [demo, llm]
        model:
          type: string
          example: "demo-simulator"

    AgentCapabilities:
      type: object
      properties:
        streaming:
          type: boolean
          default: false
        pushNotifications:
          type: boolean
          default: false
        stateTransitionHistory:
          type: boolean
          default: true

    AgentSkill:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
          example: "classify"
        name:
          type: string
          example: "Demonstrate Triage Routing"
        description:
          type: string
          example: "Show where a validated triage policy could be invoked"
        tags:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string

    AgentCard:
      type: object
      required: [name, description, version, url, protocolVersion, preferredTransport, skills]
      properties:
        name:
          type: string
          example: "triage"
        description:
          type: string
        version:
          type: string
          example: "0.1.0"
        url:
          type: string
          format: uri
          example: "http://localhost:8001/a2a"
        protocolVersion:
          type: string
          example: "0.3.0"
        preferredTransport:
          type: string
          enum: [JSONRPC]
        provider:
          type: string
          example: "Red Hat / Intel"
        capabilities:
          $ref: "#/components/schemas/AgentCapabilities"
        defaultInputModes:
          type: array
          items:
            type: string
        defaultOutputModes:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/AgentSkill"

    Part:
      type: object
      properties:
        kind:
          type: string
          default: "text"
        text:
          type: string
          minLength: 1
          maxLength: 2000

    TaskStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [submitted, working, completed, failed]
          example: "completed"
        timestamp:
          type: string

    Artifact:
      type: object
      required: [parts]
      properties:
        artifactId:
          type: string
          format: uuid
        parts:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/Part"
        metadata:
          type: object
          additionalProperties: true

    Task:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        contextId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TaskStatus"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        kind:
          type: string
          default: "task"

    JsonRpcRequest:
      type: object
      required: [method]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
          default: "2.0"
          example: "2.0"
        id:
          type: string
          minLength: 1
          maxLength: 128
        method:
          type: string
          minLength: 1
          maxLength: 64
          example: "message/send"
        params:
          type: object
          description: >
            For message/send: {id, message: {messageId, role, parts: [{kind, text}]}}.
            For tasks/get: {id}.

    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      oneOf:
        - required: [result]
        - required: [error]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
          example: "2.0"
        id:
          type: string
          minLength: 1
          maxLength: 128
        result:
          $ref: "#/components/schemas/Task"
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
